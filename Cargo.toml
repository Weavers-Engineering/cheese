[package]
name = "cheese"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Weavers Engineering"]
repository = "https://github.com/Weavers-Engineering/cheese"
description = "say cheese: pixel-perfect screenshots of your terminal"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
tiny-skia = "0.11"
cosmic-text = "0.12"
png = "0.17"
arboard = "3"
terminal_size = "0.4"
shell-words = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
