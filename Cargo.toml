[package]
name = "cheese"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Weavers Engineering"]
repository = "https://github.com/Weavers-Engineering/cheese"
description = "say cheese: pixel-perfect screenshots of your terminal"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
libghostty-vt = "0.1"
tiny-skia = "0.11"
cosmic-text = "0.12"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
